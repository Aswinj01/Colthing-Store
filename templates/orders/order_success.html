{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
.success-wrapper {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
}

.success-card {
    background: #ffffff;
    padding: 60px 40px;
    border-radius: 25px;
    text-align: center;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    animation: fadeIn 0.8s ease-in-out;
}

.checkmark-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #28a745;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: scaleIn 0.6s ease-in-out;
}

.checkmark {
    font-size: 60px;
    color: white;
}

.success-card h2 {
    margin-top: 30px;
    font-weight: 700;
}

.success-card p {
    margin-top: 15px;
    color: #555;
}

.btn-group {
    margin-top: 30px;
}

.btn-custom {
    padding: 12px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s ease;
}

.btn-primary-custom {
    background: black;
    color: white;
}

.btn-primary-custom:hover {
    background: #333;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes scaleIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
}
</style>

<div class="success-wrapper">
    <div class="success-card">
        <div class="checkmark-circle">
            <div class="checkmark">✔</div>
        </div>

        <h2>Order Placed Successfully!</h2>
        <p>
            Thank you for shopping with us.<br>
            Your order has been confirmed and is being processed.
        </p>

        <div class="btn-group">
            <a href="{% url 'home' %}" class="btn-custom btn-primary-custom">
                Continue Shopping
            </a>
        </div>

        <p style="margin-top:20px; font-size:14px; color:#888;">
            Redirecting to homepage in <span id="countdown">15</span> seconds...
        </p>
    </div>
</div>

<script>
let seconds = 15;
const countdown = document.getElementById("countdown");

const timer = setInterval(() => {
    seconds--;
    countdown.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "{% url 'home' %}";
    }
}, 1000);
</script>

{% endblock %}
