{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
    .login-section {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
    }

    .login-card {
        background: #ffffff;
        padding: 45px;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #eee;
    }

    .login-title {
        text-align: center;
        font-weight: 700;
        color: #e60000;
        margin-bottom: 30px;
    }

    .form-control {
        border-radius: 10px;
        padding: 12px;
        border: 1px solid #ddd;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: #e60000;
        box-shadow: 0 0 0 0.15rem rgba(230, 0, 0, 0.15);
    }

    .login-btn {
        background: #e60000;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #cc0000;
    }

    .register-link a {
        color: #e60000;
        font-weight: 600;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-section">
    <div class="login-card">

        <h3 class="login-title">Login to Your Account</h3>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}


        <form method="POST">
            {% csrf_token %}
            
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <div class="mb-3">
                <input type="text" name="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn login-btn w-100">
                Login
            </button>
        </form>

        <div class="text-center mt-4 register-link">
            <small class="text-muted">
                Don't have an account?
                <a href="{% url 'register' %}">Register here</a>
            </small>
        </div>

    </div>
</div>

{% endblock %}
